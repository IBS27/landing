<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      html, body { margin: 0; overflow: hidden; }
      #m { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="m"></div>
    <script>
      // Renders one OpenFreeMap style at a time; render.mjs drives window.show().
      let map = null;
      let current = null;
      window.show = (style, lng, lat, zoom) =>
        new Promise((resolve) => {
          if (!map || current !== style) {
            map?.remove();
            current = style;
            map = new maplibregl.Map({
              container: "m",
              style: `https://tiles.openfreemap.org/styles/${style}`,
              center: [lng, lat],
              zoom,
              interactive: false,
              attributionControl: false,
              fadeDuration: 0,
              preserveDrawingBuffer: true,
            });
          } else {
            map.resize();
            map.jumpTo({ center: [lng, lat], zoom });
          }
          map.once("idle", () => resolve(true));
        });
    </script>
  </body>
</html>
